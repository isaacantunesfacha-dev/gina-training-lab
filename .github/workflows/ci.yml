name: CI

# Same checks as CLAUDE.md "Local Verification Environment", enforced on every PR and push to main.
# No secrets: tests that spawn server.ts must never see SALESFORCE_*, HUBSPOT_* or GEMINI_* values.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the version from package.json "packageManager" (pnpm@11.28.5)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0 # keep equal to package.json engines.node
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm run lint
      - run: npm run scan
      # Includes scripts/showcase.test.mjs, which builds the showcase and fails on leaked strings
      - run: npm test
      - run: npm run build:showcase
